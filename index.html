<!DOCTYPE html>

<html lang="es">

<head>

    <link rel="icon" type="image/png" href="favicon.png">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JC Zumaya | Portafolio 🐝 Pro</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>

        /* ESTILO MATRIX VERDE - DISEÑO ORIGINAL JC ZUMAYA */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { background-color: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }

        #matrix-canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.8; }



        .card {

            position: relative; z-index: 2; background: rgba(5, 5, 5, 0.95);

            backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 65, 0.3);

            border-radius: 30px; padding: 25px; width: 380px; text-align: center;

            box-shadow: 0 0 50px rgba(0, 255, 65, 0.2);

        }



        .profile-container {

            position: relative; width: 85px; height: 85px; margin: 0 auto 10px;

            display: flex; justify-content: center; align-items: center; border-radius: 50%;

            background: linear-gradient(45deg, #ff0000, #48ff00, #002bff, #ff00c8);

            background-size: 400%; animation: moveRGB 8s linear infinite;

        }

       

        .profile-img {

            width: 77px; height: 77px; background: #000; border-radius: 50%;

            display: flex; justify-content: center; align-items: center; overflow: hidden;

        }



        .logo-inside { width: 100%; height: 100%; object-fit: contain; padding: 8px; }



        h1 { font-size: 18px; margin-bottom: 5px; color: #fff; letter-spacing: 1px; }

        .email-info { font-size: 11px; color: #38bdf8; margin-bottom: 2px; display: block; text-decoration: none; }

        .location-info { font-size: 10px; color: #666; margin-bottom: 10px; display: block; }



        .cedula-badge { font-size: 9px; color: #aaa; font-family: monospace; display: block; margin-bottom: 5px; }

        .freelancer-tag {

            display: inline-block; margin-bottom: 10px; padding: 3px 12px; border-radius: 20px;

            font-size: 10px; font-weight: bold; color: #fff; border: 1px solid #00ff41;

            background: rgba(0, 255, 65, 0.1); animation: glowText 2s ease-in-out infinite alternate;

        }



        .professional-titles { font-size: 10px; color: #00ff41; margin-bottom: 15px; font-weight: 600; text-shadow: 0 0 10px rgba(0, 255, 65, 0.5); border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }



        .links { display: flex; flex-direction: column; gap: 10px; }



        .link-item {

            position: relative; background: #0a0a0a; color: #fff; text-decoration: none;

            padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 500;

            display: flex; align-items: center; justify-content: center; gap: 10px;

            z-index: 1; overflow: hidden; cursor: pointer; border: 1px solid transparent;

        }



        /* Botón especial para ZUMATEK */

        .link-zumatek {

            border: 1px solid #38bdf8 !important;

            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);

        }



        .link-item::before {

            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;

            background: linear-gradient(45deg, #ff0000, #00ff41, #002bff, #ff00c8);

            background-size: 400%; z-index: -1; filter: blur(5px);

            animation: moveRGB 10s linear infinite; opacity: 0.4; transition: 0.3s;

        }



        .link-item:hover::before { opacity: 1; filter: blur(8px); }



        .link-portafolio { background: linear-gradient(90deg, #00ff41, #008f11) !important; color: #000 !important; font-weight: 800 !important; }



        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; }

        .modal-content { background: #111; border: 1px solid #00ff41; padding: 20px; border-radius: 20px; width: 95%; max-width: 420px; color: #fff; text-align: left; position: relative; box-shadow: 0 0 30px rgba(0, 255, 65, 0.3); max-height: 80vh; overflow-y: auto; }

        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #00ff41; }

        .modal-content h2 { color: #00ff41; font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 5px; }

        .modal-content li { font-size: 12px; line-height: 1.4; margin-bottom: 8px; list-style: none; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; }

        .modal-content b { color: #38bdf8; }



        @keyframes moveRGB { 0% { background-position: 0 0; } 50% { background-position: 400% 0; } 100% { background-position: 0 0; } }

        @keyframes glowText { from { box-shadow: 0 0 5px #00ff41; } to { box-shadow: 0 0 15px #00ff41; } }

    </style>

</head>

<body>



    <canvas id="matrix-canvas"></canvas>



    <div class="card">

        <div class="profile-container">

            <div class="profile-img">

                <img src="logo.png" alt="Logo ZUMATEK" class="logo-inside">

            </div>

        </div>

       

        <h1>Juan Carlos Zumaya Ramirez</h1>

        <a href="mailto:jrcarlos.20@gmail.com" class="email-info"><i class="fas fa-envelope"></i> jrcarlos.20@gmail.com</a>

        <span class="location-info"><i class="fas fa-map-marker-alt"></i> Irapuato, Gto. 🇲🇽</span>

       

        <div class="header-info">

            <span class="cedula-badge">FED: 15130329|15550978 |EST: 00030736</span>

            <div class="freelancer-tag">FREELANCER EXPERTO 🚀</div>

        </div>



        <div id="titulos" class="professional-titles">

            INGENIERO EN SISTEMAS | SOFTWARE DEVELOPER <br> DATA ANALYST | ELECTRÓNICA DIGITAL

        </div>



        <div class="links" id="botones">

            </div>

    </div>



    <div id="myModal" class="modal">

        <div class="modal-content">

            <span class="close-btn" onclick="cerrarModal()">&times;</span>

            <div id="modal-body"></div>

        </div>

    </div>



    <script>

        // EFECTO MATRIX

        const canvas = document.getElementById('matrix-canvas');

        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        const letters = "01"; const fontSize = 16;

        const columns = canvas.width / fontSize;

        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {

            ctx.fillStyle = "rgba(0, 0, 0, 0.1)"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00ff41"; ctx.font = fontSize + "px monospace";

            drops.forEach((y, i) => {

                const text = letters[Math.floor(Math.random() * letters.length)];

                ctx.fillText(text, i * fontSize, y * fontSize);

                if (y * fontSize > canvas.height && Math.random() * 0.98) drops[i] = 0;

                drops[i]++;

            });

        }

        setInterval(drawMatrix, 50);



        // DATOS DE TRAYECTORIA Y HABILIDADES

        const info = {

            "formacion": {

                "titulo": "🎓 Trayectoria Prof. 💼",

                "html": `<li><b>🧠 Maestría en IA (En Curso):</b> UVEG (2025).</li>

                         <li><b>💻 Ing. en Sistemas Computacionales:</b> UVEG (2020 - 2023).</li>

                         <li><b>⚡ Ing. en Comunicaciones y Electrónica:</b> UG 🐝 (2019 - 2025).</li>

                         <li><b>🏗️ Fundador e Ingeniero Principal:</b> ZUMATEK (2026).</li>

                         <li><b>👨‍🏫 Docente Academia Alto Rendimiento SANSEN:</b> (2018 - 2020).</li>

                         <li><b>🤖 Electrónica y Desarrollo:</b> Inbiodroid (2018 - 2019).</li>

                         <li><b>👨‍🏫 Docente Robótica e Informática:</b> Talentos Irapuato (2025).</li>`

            },

            "tecnicas": {

                "titulo": "🛠️ Habilidades y Software ⚙️",

                "html": `<li><b>⌨️ Lenguajes:</b> C, C++, Python, Java, JS, PHP, HTML/CSS.</li>

                         <li><b>🗄️ Bases de Datos:</b> SQL, MySQL, SQL Server.</li>

                         <li><b>🔬 Ingeniería:</b> Proteus, MATLAB, AutoCAD.</li>

                         <li><b>🇺🇸 Idioma:</b> Inglés (C1 Avanzado).</li>`

            },

            "blandas": {

                "titulo": "🤝 Habilidades Blandas ✨",

                "html": "<li>🎯 Resolución de problemas técnicos complejos.</li><li>👨‍💻 Liderazgo en equipos de robótica.</li><li>🗺️ Adaptabilidad y movilidad nacional.</li>"

            }

        };



        function cargarPagina() {

            const container = document.getElementById('botones');

            container.innerHTML = '';



            // 1. NUEVO BOTÓN ZUMATEK (SERVICIOS)

            const btnZuma = document.createElement('div');

            btnZuma.className = "link-item link-zumatek";

            btnZuma.onclick = () => window.location.href = 'servicios.html';

            btnZuma.innerHTML = `<i class="fas fa-microchip"></i> <b>ZUMATEK</b>`;

            container.appendChild(btnZuma);



            // 2. BOTÓN PORTAFOLIO PROYECTOS

            const btnPort = document.createElement('div');

            btnPort.className = "link-item link-portafolio";

            btnPort.onclick = () => window.location.href = 'proyectos.html';

            btnPort.innerHTML = `<i class="fas fa-briefcase"></i> PORTAFOLIO PROYECTOS`;

            container.appendChild(btnPort);



            // 3. BOTONES DE MODALES (Trayectoria, Tecnologías, Habilidades)

            const btnSpecs = [

                { id: "formacion", n: "Trayectoria", i: "fa-graduation-cap" },

                { id: "tecnicas", n: "Tecnologías", i: "fa-laptop-code" },

                { id: "blandas", n: "Habilidades", i: "fa-users" }

            ];

            btnSpecs.forEach(spec => {

                const div = document.createElement('div');

                div.className = "link-item";

                div.onclick = () => abrirModal(spec.id);

                div.innerHTML = `<i class="fas ${spec.i}"></i> ${spec.n}`;

                container.appendChild(div);

            });



            // 4. BOTÓN DESCARGAR CV

            const cv = document.createElement('a');

            cv.className = "link-item";

            cv.href = "CV_Juan_Carlos_Zumaya.pdf";

            cv.download = "CV_Juan_Carlos_Zumaya.pdf";

            cv.innerHTML = `<i class="fas fa-file-pdf"></i> Descargar CV`;

            container.appendChild(cv);



            // 5. BOTÓN WHATSAPP

            const ws = document.createElement('a');

            ws.className = "link-item";

            ws.style.background = "#059669";

            ws.href = "https://wa.me/524622647020";

            ws.target = "_blank";

            ws.innerHTML = `<i class="fab fa-whatsapp"></i> WhatsApp`;

            container.appendChild(ws);

        }



        function abrirModal(id) {

            document.getElementById('modal-body').innerHTML = `<h2>${info[id].titulo}</h2><ul>${info[id].html}</ul>`;

            document.getElementById('myModal').style.display = "flex";

        }

        function cerrarModal() { document.getElementById('myModal').style.display = "none"; }

       

        cargarPagina();

    </script>

</body>

</html>
